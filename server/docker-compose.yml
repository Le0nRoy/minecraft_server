version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:latest
    ports:
      - "${SERVER_PORT}:25565"
      - "${RCON_PORT}:25575"
    env_file:
      - ../.env
    environment:
      EULA: "TRUE"
      VERSION: "${MINECRAFT_VERSION}"
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION}"
      MEMORY: "${SERVER_MEMORY_MAX}"
      INIT_MEMORY: "${SERVER_MEMORY_MIN}"
      RCON_ENABLED: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      DIFFICULTY: "normal"
      OPS: ""
      ALLOW_NETHER: "true"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      MOTD: "Welcome to the Modded Server"
      USE_AIKAR_FLAGS: "true"
      JVM_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled"
      COPY_CONFIG_DEST: "/data"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      OVERRIDE_SERVER_PROPERTIES: "false"
      PACKWIZ_URL: "file:///packwiz/pack.toml"
    volumes:
      - minecraft_data:/data
      - ../packwiz:/packwiz:ro
      - ./config:/config:ro
    restart: unless-stopped
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - minecraft
    labels:
      com.minecraft-server.service: "minecraft"
      com.minecraft-server.version: "${MINECRAFT_VERSION}"

  healthcheck-sidecar:
    build:
      context: ../healthcheck
    ports:
      - "${HEALTHCHECK_PORT}:8080"
    environment:
      RCON_HOST: "minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    depends_on:
      - minecraft
    networks:
      - minecraft
    restart: unless-stopped

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    environment:
      CONTAINERS: 1    # docker ps / docker inspect (GET)
      ALLOW_STOP: 1    # docker stop (independent of POST)
      ALLOW_START: 1   # docker start (independent of POST)
      # POST remains 0 (default) — bot cannot create containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    profiles:
      - telegram

  telegram-bot:
    build:
      context: ../telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      MINECRAFT_HOST: "minecraft"
      RCON_HOST: "minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"
      DOCKER_HOST: "tcp://socket-proxy:2375"
      WIPE_SCRIPT: "/scripts/wipe.sh"
      RCON_WARN_DELAY: "${RCON_WARN_DELAY:-10}"
      MINECRAFT_DATA_PATH: "/minecraft_data"
      LEVEL: "${LEVEL:-world}"
    volumes:
      - ../scripts:/scripts:ro
      - minecraft_data:/minecraft_data:rw
    depends_on:
      - minecraft
      - socket-proxy
    networks:
      - minecraft
      - socket-proxy
    restart: unless-stopped
    profiles:
      - telegram

volumes:
  minecraft_data:

networks:
  minecraft:
    driver: bridge
  socket-proxy:
    driver: bridge
