version: "3.8"

services:
  minecraft:
    image: itzg/minecraft-server:latest
    ports:
      - "${SERVER_PORT}:25565"
      - "${RCON_PORT}:25575"
    env_file:
      - ../.env
    environment:
      EULA: "TRUE"
      VERSION: "${MINECRAFT_VERSION}"
      TYPE: "NEOFORGE"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION}"
      MEMORY: "${SERVER_MEMORY_MAX}"
      INIT_MEMORY: "${SERVER_MEMORY_MIN}"
      RCON_ENABLED: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      DIFFICULTY: "normal"
      OPS: ""
      ALLOW_NETHER: "true"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      MOTD: "Welcome to the Modded Server"
      USE_AIKAR_FLAGS: "true"
      JVM_OPTS: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled"
      COPY_CONFIG_DEST: "/data"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      OVERRIDE_SERVER_PROPERTIES: "false"
      PACKWIZ_URL: "file:///packwiz/pack.toml"
      # Hardcoded — intentionally not overridable via .env.
      # Network access is restricted to Tailscale; Mojang auth is disabled.
      ONLINE_MODE: "false"
      ENFORCE_SECURE_PROFILE: "false"
    volumes:
      - minecraft_data:/data
      - ../packwiz:/packwiz:ro
      - ./config:/config:ro
    restart: unless-stopped
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - minecraft
    labels:
      com.minecraft-server.service: "minecraft"
      com.minecraft-server.version: "${MINECRAFT_VERSION}"

  healthcheck-sidecar:
    build:
      context: ../healthcheck
    ports:
      - "${HEALTHCHECK_PORT}:8080"
    environment:
      RCON_HOST: "minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    depends_on:
      - minecraft
    networks:
      - minecraft
    restart: unless-stopped

  telegram-bot:
    build:
      context: ../telegram-bot
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      MINECRAFT_HOST: "minecraft"
      RCON_HOST: "minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
    depends_on:
      - minecraft
    networks:
      - minecraft
    restart: unless-stopped
    profiles:
      - telegram

  auth-sidecar:
    build:
      context: ../auth-sidecar
    network_mode: host
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      AUTH_SIDECAR_PORT: "${AUTH_SIDECAR_PORT:-8181}"
    depends_on:
      - minecraft
    restart: unless-stopped

volumes:
  minecraft_data:

networks:
  minecraft:
    driver: bridge
