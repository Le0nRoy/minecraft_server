name: Python Tests

on:
  push:
    paths:
      - 'telegram-bot/**'
      - 'healthcheck/**'
      - 'auth-sidecar/**'
      - 'velocity/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'telegram-bot/**'
      - 'healthcheck/**'
      - 'auth-sidecar/**'
      - 'velocity/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r telegram-bot/requirements.txt -r healthcheck/requirements.txt -r auth-sidecar/requirements.txt
      - name: Run tests (telegram-bot, healthcheck)
        run: python -m pytest telegram-bot/ healthcheck/ -v
      - name: Run tests (auth-sidecar)
        run: python -m pytest auth-sidecar/ -v

  test-velocity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run Velocity plugin tests
        run: cd velocity/plugin && ./gradlew test
