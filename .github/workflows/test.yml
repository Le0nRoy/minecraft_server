name: Python Tests

on:
  push:
    paths:
      - 'telegram-bot/**'
      - 'healthcheck/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'
  pull_request:
    paths:
      - 'telegram-bot/**'
      - 'healthcheck/**'
      - 'requirements-dev.txt'
      - 'pytest.ini'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r telegram-bot/requirements.txt -r healthcheck/requirements.txt
      - name: Run tests
        run: python -m pytest telegram-bot/ healthcheck/ -v
